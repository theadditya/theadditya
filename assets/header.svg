<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Dark Mode Palette -->
    <linearGradient id="bgGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0d1322" />
      <stop offset="100%" stop-color="#161c30" />
    </linearGradient>

    <!-- Animated Aurora Text Gradient -->
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8; #818cf8; #c084fc; #f472b6; #38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8; #c084fc; #f472b6; #38bdf8; #818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc; #f472b6; #38bdf8; #818cf8; #c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Animated Wave 1 -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Animated Wave 2 -->
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7">
        <animate attributeName="stop-opacity" values="0.7;0.2;0.7" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.7">
        <animate attributeName="stop-opacity" values="0.7;0.2;0.7" dur="4s" repeatCount="indefinite" begin="2s" />
      </stop>
    </linearGradient>

    <!-- Particle Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .banner-bg {
      fill: url(#bgGradDark);
    }
    .main-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -0.5px;
      fill: url(#auroraGrad);
    }
    .badge-pill {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      fill: #38bdf8;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 16px;
      font-weight: 400;
      fill: #94a3b8;
    }
    .code-bracket {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 13px;
      fill: #64748b;
    }

    /* Light Mode Customization */
    @media (prefers-color-scheme: light) {
      .banner-bg {
        fill: #f8fafc;
      }
      .sub-text {
        fill: #475569;
      }
      .code-bracket {
        fill: #64748b;
      }
      .card-border {
        stroke: #cbd5e1;
      }
    }
  </style>

  <!-- Container -->
  <rect class="banner-bg" x="2" y="2" width="896" height="236" rx="18" />
  <rect class="card-border" x="2" y="2" width="896" height="236" rx="18" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Animated Ambient Floating Waves at the bottom -->
  <g opacity="0.6">
    <path fill="url(#waveGrad1)">
      <animate attributeName="d" dur="10s" repeatCount="indefinite" values="
        M 0 200 Q 225 170 450 200 T 900 200 L 900 240 L 0 240 Z;
        M 0 200 Q 225 230 450 200 T 900 200 L 900 240 L 0 240 Z;
        M 0 200 Q 225 170 450 200 T 900 200 L 900 240 L 0 240 Z
      " />
    </path>
    <path fill="url(#waveGrad2)">
      <animate attributeName="d" dur="8s" repeatCount="indefinite" values="
        M 0 210 Q 225 240 450 210 T 900 210 L 900 240 L 0 240 Z;
        M 0 210 Q 225 180 450 210 T 900 210 L 900 240 L 0 240 Z;
        M 0 210 Q 225 240 450 210 T 900 210 L 900 240 L 0 240 Z
      " />
    </path>
  </g>

  <!-- Ambient Light Orbs with Pulsing Glow -->
  <circle cx="180" cy="80" r="90" fill="#38bdf8" fill-opacity="0.12" filter="url(#glow)">
    <animate attributeName="r" values="80;110;80" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="720" cy="150" r="100" fill="#9333ea" fill-opacity="0.12" filter="url(#glow)">
    <animate attributeName="r" values="90;120;90" dur="7s" repeatCount="indefinite" />
  </circle>

  <!-- Status / Pill Badge -->
  <g transform="translate(450, 48)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
    <!-- Pulsing Green Dot -->
    <circle cx="-120" cy="0" r="4.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="-106" y="4" class="badge-pill">FULL-STACK &amp; SYSTEMS BUILDER</text>
  </g>

  <!-- Shimmering Name -->
  <text x="450" y="125" text-anchor="middle" class="main-title">
    Additya Pramanik
  </text>

  <!-- Subtitle -->
  <text x="450" y="162" text-anchor="middle" class="sub-text">
    Bridging code, systems, and human impact.
  </text>

  <!-- Tech Breadcrumb -->
  <text x="450" y="195" text-anchor="middle" class="code-bracket">
    [ Python • C/C++ • Flask • TypeScript • Docker • Linux ]
  </text>

  <!-- Decorative Animated Corner Brackets -->
  <path d="M 25 45 L 25 25 L 45 25" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round">
    <animate attributeName="stroke-opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite" />
  </path>
  <path d="M 875 45 L 875 25 L 855 25" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round">
    <animate attributeName="stroke-opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite" begin="1.5s" />
  </path>
  <path d="M 25 195 L 25 215 L 45 215" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round">
    <animate attributeName="stroke-opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite" begin="1s" />
  </path>
  <path d="M 875 195 L 875 215 L 855 215" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round">
    <animate attributeName="stroke-opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite" begin="2.5s" />
  </path>
</svg>
